<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aeroplane Chess round icon</title>
  <desc id="desc">The Aeroplane Chess app mark prepared for circular launcher masks.</desc>
  <defs>
    <clipPath id="round-clip">
      <circle cx="512" cy="512" r="512" />
    </clipPath>
  </defs>
  <g clip-path="url(#round-clip)">
    <use href="aeroplane-chess-icon.svg#brand-mark" />
  </g>
</svg>
