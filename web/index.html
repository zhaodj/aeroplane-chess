<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Aeroplane Chess / 飞行棋</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
    <script type="module">
      function ensureCanvas() {
        const existing = document.querySelector("canvas#bevy");
        if (existing) return existing;
        const canvas = document.createElement("canvas");
        canvas.id = "bevy";
        document.body.appendChild(canvas);
        return canvas;
      }

      function syncCanvasSize(canvas) {
        const scale = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(window.innerWidth * scale));
        canvas.height = Math.max(1, Math.floor(window.innerHeight * scale));
      }

      async function boot() {
        const canvas = ensureCanvas();
        syncCanvasSize(canvas);
        window.addEventListener("resize", () => syncCanvasSize(canvas));

        const params = new URLSearchParams(window.location.search);
        const smokeEnabled = params.has("ac_autoplay");
        const markSmokeShell = (state) => {
          if (smokeEnabled) {
            document.body.setAttribute("data-ac-smoke-shell", state);
            document.body.setAttribute(
              "data-ac-smoke-query-shell",
              window.location.search,
            );
          }
        };
        const assetCache = params.get("cache");
        const cacheSuffix = assetCache
          ? `?cache=${encodeURIComponent(assetCache)}`
          : "";
        markSmokeShell("before-import");
        const wasmModule = await import(
          `./aeroplane_chess.js${cacheSuffix}`
        );
        const { default: init, wasm_start: wasmStart } = wasmModule;
        markSmokeShell("before-init");
        const wasmUrl = new URL(
          `./aeroplane_chess_bg.wasm${cacheSuffix}`,
          window.location.href,
        );
        try {
          await init({ module_or_path: wasmUrl });
          markSmokeShell("initialized");
          wasmStart();
          markSmokeShell("started");
        } catch (err) {
          markSmokeShell("error");
          if (smokeEnabled) {
            document.body.setAttribute(
              "data-ac-smoke-error",
              `${err?.message || err}`.slice(0, 500),
            );
            document.body.setAttribute(
              "data-ac-smoke-error-stack",
              `${err?.stack || ""}`.slice(0, 1000),
            );
          }
          throw err;
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          boot().catch((err) => {
            console.error("Failed to initialize WASM app:", err);
          });
        });
      } else {
        boot().catch((err) => {
          console.error("Failed to initialize WASM app:", err);
        });
      }
    </script>
  </body>
  </html>
