<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aeroplane Chess (WASM)</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
    <script type="module">
      import init from "./aeroplane_chess.js";

      function ensureCanvas() {
        const existing = document.querySelector("canvas#bevy");
        if (existing) return existing;
        const canvas = document.createElement("canvas");
        canvas.id = "bevy";
        document.body.appendChild(canvas);
        return canvas;
      }

      function syncCanvasSize(canvas) {
        const scale = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(window.innerWidth * scale));
        canvas.height = Math.max(1, Math.floor(window.innerHeight * scale));
      }

      async function boot() {
        const canvas = ensureCanvas();
        syncCanvasSize(canvas);
        window.addEventListener("resize", () => syncCanvasSize(canvas));
        await init();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          boot().catch((err) => {
            console.error("Failed to initialize WASM app:", err);
          });
        });
      } else {
        boot().catch((err) => {
          console.error("Failed to initialize WASM app:", err);
        });
      }
    </script>
  </body>
  </html>
