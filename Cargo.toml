[package]
name = "aeroplane-chess"
version = "0.1.0"
edition = "2024"

[lib]
name = "aeroplane_chess"
crate-type = ["lib", "cdylib"]

[dependencies]
bevy_ecs = "0.19.0"
bevy_state = "0.19.0"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1.7"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
bevy = "0.19.0"

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.19.0", features = ["android-game-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite_render",
    "bevy_ui_render",
    "default_font",
    "keyboard",
    "mouse",
    "png",
    "touch",
    "webgl2",
] }
wasm-bindgen = "0.2.118"
web-sys = { version = "0.3.95", features = [
    "Document",
    "Element",
    "HtmlAudioElement",
    "HtmlElement",
    "HtmlMediaElement",
    "Location",
    "Window",
] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
